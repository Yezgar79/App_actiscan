worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ─── FIREWALL: Rate Limiting Zones ────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ─── LOAD BALANCER: Backend Pool (dos instancias) ─────────────────────────────
    upstream backend_pool {
        least_conn;
        server backend:8000  weight=1 max_fails=3 fail_timeout=30s;
        server backend2:8000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── Web Pool (Flask) ─────────────────────────────────────────────────────────
    upstream web_pool {
        server web:5000;
        keepalive 16;
    }

    # ─── HTTP (Puerto 80): API disponible para App Móvil + redirect web a HTTPS ──
    server {
        listen 80;
        server_name _;

        # ── nginx stub_status: solo accesible desde la red interna de Docker ─
        location /nginx_status {
            stub_status;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }

        # API accesible por HTTP (App Móvil no requiere SSL)
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Redirige tráfico web al HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Servidor Público Principal (Puerto 443) ───────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # ── Certificado SSL ──────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/actiscan.crt;
        ssl_certificate_key /etc/nginx/ssl/actiscan.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # ── FIREWALL: Cabeceras de Seguridad ─────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options     "nosniff"                             always;
        add_header X-XSS-Protection           "1; mode=block"                       always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

        # ── FIREWALL: Bloqueo de Bots Maliciosos ─────────────────────────────────
        if ($http_user_agent ~* "(nikto|sqlmap|nmap|masscan|zgrab|dirbuster|hydra|medusa)") {
            return 403;
        }

        # ── FIREWALL: Límite de Conexiones Simultáneas ───────────────────────────
        limit_conn conn 20;

        # ── Login: Rate Limiting Estricto (anti brute-force) ─────────────────────
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── API REST → Backend Pool (Balanceo de Carga) ──────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Docs / Health (backend) ──────────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi\.json|health) {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Métricas: sólo desde la red interna de Docker ────────────────────
        location /metrics {
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Web (Flask+Jinja2) ───────────────────────────────────────────────────
        location / {
            proxy_pass         http://web_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
