{% extends "admin/layout.html" %}
{% block title %}Nueva Auditoría{% endblock %}
{% block breadcrumb %}
  <span class="breadcrumb-sep">›</span><a href="{{ url_for('admin.audits') }}">Auditorías</a>
  <span class="breadcrumb-sep">›</span><span>Nueva</span>
{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title"><i class="bi bi-plus-lg"></i> Nueva auditoría</h1></div>
{% if error %}<div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</div>{% endif %}
<div class="card" style="max-width:700px;">
  <div class="card-body">
    <form method="POST" data-no-double-submit>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Título de la auditoría<span class="required">*</span></label>
        <input type="text" name="title" class="form-control" required placeholder="Ej: Auditoría Trimestral Q1 2025 — Torre A">
      </div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Objetivo y alcance de la auditoría"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Capturista asignado<span class="required">*</span></label>
          <select name="auditor_id" class="form-control" required>
            <option value="">Selecciona un capturista</option>
            {% for u in users %}
            <option value="{{ u.id }}">{{ u.name }} ({{ {'auditor':'Capturista','admin':'Admin','super_admin':'SuperAdmin'}.get(u.role, u.role) }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Ubicación / Sede</label>
          <select name="location_id" class="form-control">
            <option value="">Sin restricción de ubicación</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}">{{ loc.name }}{% if loc.building %} — {{ loc.building }}{% endif %}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Fecha y hora inicio prevista</label>
          <input type="datetime-local" name="planned_start" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Fecha y hora fin prevista</label>
          <input type="datetime-local" name="planned_end" class="form-control">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notas internas</label>
        <textarea name="notes" class="form-control" rows="2" placeholder="Notas para el capturista o el equipo"></textarea>
      </div>
      <div class="d-flex gap-1 mt-2">
        <button type="submit" class="btn btn-primary">Crear auditoría</button>
        <a href="{{ url_for('admin.audits') }}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
