{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block body %}
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand">ActiScan</div>
      <div class="tagline">Sistema de Gestión y Auditoría de Activos</div>
    </div>

    <h2 class="login-title">Acceso al Sistema</h2>

    {% if error %}
    <div class="alert alert-danger" role="alert"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}" data-no-double-submit novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="identifier">
          Correo electrónico o usuario<span class="required">*</span>
        </label>
        <input
          type="text" id="identifier" name="identifier"
          class="form-control {% if error %}is-invalid{% endif %}"
          autocomplete="username"
          placeholder="usuario@empresa.mx o nombre_usuario"
          required autofocus
          value="{{ request.form.get('identifier', '') }}"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Contraseña<span class="required">*</span>
        </label>
        <div class="password-wrapper">
          <input
            type="password" id="password" name="password"
            class="form-control {% if error %}is-invalid{% endif %}"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            required
          >
          <button type="button" class="password-toggle" aria-label="Mostrar/ocultar contraseña"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg" style="margin-top:.5rem;">
        Iniciar sesión
      </button>
    </form>

    <p class="text-center text-sm text-muted" style="margin-top:1.5rem;">
      ¿Problemas para acceder? Contacta al administrador del sistema.
    </p>
  </div>
</div>
{% endblock %}
