services:
  - type: web
    name: actiscan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: actiscan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://actiscan.vercel.app

databases:
  - name: actiscan-db
    plan: free
    databaseName: actiscan_db
    user: actiscan_user
