services:
  - type: web
    name: actiscan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: actiscan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://actiscan-web.onrender.com

  - type: web
    name: actiscan-web
    runtime: python
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: API_BASE_URL
        fromService:
          name: actiscan-api
          type: web
          property: host
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: WTF_CSRF_ENABLED
        value: "true"

databases:
  - name: actiscan-db
    plan: free
    databaseName: actiscan_db
    user: actiscan_user
