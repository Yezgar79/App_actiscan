networks:
  # Red pública: sólo nginx tiene acceso al exterior
  public_net:
    name: actiscan_public
  # Red privada: servicios internos sin exposición directa
  private_net:
    name: actiscan_private
    internal: true

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # BASE DE DATOS (Servidor Privado)
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: actiscan_db
    restart: unless-stopped
    networks:
      - private_net
    environment:
      POSTGRES_USER: actiscan
      POSTGRES_PASSWORD: actiscan123
      POSTGRES_DB: actiscan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actiscan -d actiscan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND — Instancia 1 (Servidor Privado)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: actiscan_backend_1
    restart: unless-stopped
    networks:
      - private_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://actiscan:actiscan123@db:5432/actiscan_db
      SECRET_KEY: super-secret-key-actiscan-2024-change-in-prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "https://localhost,http://localhost,http://localhost:3000"
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND — Instancia 2 (Servidor Privado — Balanceo de Carga)
  # ─────────────────────────────────────────────────────────────────────────────
  backend2:
    build: ./backend
    container_name: actiscan_backend_2
    restart: unless-stopped
    networks:
      - private_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://actiscan:actiscan123@db:5432/actiscan_db
      SECRET_KEY: super-secret-key-actiscan-2024-change-in-prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "https://localhost,http://localhost,http://localhost:3000"
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────────────────────────────────────
  # WEB — Flask+Jinja2 (Servidor Privado)
  # ─────────────────────────────────────────────────────────────────────────────
  web:
    build: ./web
    container_name: actiscan_web
    restart: unless-stopped
    networks:
      - private_net
    depends_on:
      - backend
      - backend2
    environment:
      SECRET_KEY: super-secret-key-flask-actiscan-2024-change-in-prod
      API_BASE_URL: http://backend:8000
      FLASK_ENV: development
      SESSION_COOKIE_SECURE: "false"
      WTF_CSRF_ENABLED: "true"
    volumes:
      - ./web:/app
      - web_sessions:/tmp/flask_sessions

  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX — Servidor Público (SSL + Firewall + Balanceador de Carga)
  # Único punto de entrada desde el exterior (puertos 80 y 443)
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    build: ./nginx
    container_name: actiscan_nginx
    restart: unless-stopped
    networks:
      - public_net
      - private_net
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - backend2
      - web

  # ─────────────────────────────────────────────────────────────────────────────
  # NODE EXPORTER — Métricas del Sistema (CPU, RAM, Disco)
  # Solo red privada, sin exposición externa
  # ─────────────────────────────────────────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:v1.8.0
    container_name: actiscan_node_exporter
    restart: unless-stopped
    networks:
      - private_net
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX EXPORTER — Métricas del Balanceador de Carga
  # Raspa nginx stub_status; solo red privada
  # ─────────────────────────────────────────────────────────────────────────────
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: actiscan_nginx_exporter
    restart: unless-stopped
    networks:
      - private_net
      - public_net
    command:
      - '--nginx.scrape-uri=http://nginx/nginx_status'
    depends_on:
      - nginx

  # ─────────────────────────────────────────────────────────────────────────────
  # PROMETHEUS — Recolección de Métricas (Monitoreo)
  # Puerto ligado a localhost — no accesible desde el exterior
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: actiscan_prometheus
    restart: unless-stopped
    networks:
      - private_net
      - public_net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - node_exporter
      - nginx_exporter

  # ─────────────────────────────────────────────────────────────────────────────
  # GRAFANA — Visualización de Monitoreo
  # Puerto ligado a localhost — no accesible desde el exterior
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: actiscan_grafana
    restart: unless-stopped
    networks:
      - private_net
      - public_net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: actiscan123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/actiscan.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────────────────────────────────────
  # PGADMIN — Administrador de Base de Datos
  # Puerto ligado a localhost — no accesible desde el exterior
  # ─────────────────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: actiscan_pgadmin
    restart: unless-stopped
    networks:
      - private_net
      - public_net
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@actiscan.mx
      PGADMIN_DEFAULT_PASSWORD: actiscan123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  web_sessions:
